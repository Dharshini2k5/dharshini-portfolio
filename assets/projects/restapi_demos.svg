<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#12161f"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- subtle dot grid -->
  <g opacity="0.12">
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff"/>
    </pattern>
    <rect width="800" height="450" fill="url(#dots)"/>
  </g>

  <!-- title -->
  <text x="48" y="64" font-family="'Space Grotesk', Arial, sans-serif" font-size="28" font-weight="700" fill="#edeff3">REST API Demos</text>
  <text x="48" y="90" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8b93a3">Java &#183; Spring Boot &#183; 3 independent services</text>

  <!-- connecting lines from hub to endpoints -->
  <line x1="400" y1="260" x2="220" y2="360" stroke="url(#accentLine)" stroke-width="2" opacity="0.8"/>
  <line x1="400" y1="260" x2="400" y2="380" stroke="url(#accentLine)" stroke-width="2" opacity="0.8"/>
  <line x1="400" y1="260" x2="580" y2="360" stroke="url(#accentLine)" stroke-width="2" opacity="0.8"/>

  <!-- hub -->
  <circle cx="400" cy="230" r="70" fill="url(#hubGlow)"/>
  <circle cx="400" cy="230" r="44" fill="#171c27" stroke="#5eead4" stroke-width="2"/>
  <text x="400" y="224" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5eead4" font-weight="600">SPRING</text>
  <text x="400" y="240" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5eead4" font-weight="600">BOOT</text>

  <!-- endpoint: bank -->
  <g>
    <rect x="150" y="360" width="140" height="52" rx="10" fill="#171c27" stroke="rgba(255,255,255,0.12)"/>
    <text x="220" y="382" text-anchor="middle" font-size="20">&#127974;</text>
    <text x="220" y="402" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#edeff3">/bank</text>
  </g>

  <!-- endpoint: swiggy -->
  <g>
    <rect x="330" y="380" width="140" height="52" rx="10" fill="#171c27" stroke="rgba(255,255,255,0.12)"/>
    <text x="400" y="402" text-anchor="middle" font-size="20">&#127829;</text>
    <text x="400" y="422" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#edeff3">/swiggy</text>
  </g>

  <!-- endpoint: bookstore -->
  <g>
    <rect x="510" y="360" width="140" height="52" rx="10" fill="#171c27" stroke="rgba(255,255,255,0.12)"/>
    <text x="580" y="382" text-anchor="middle" font-size="20">&#128218;</text>
    <text x="580" y="402" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#edeff3">/bookstore</text>
  </g>

  <!-- small status pill -->
  <rect x="620" y="40" width="132" height="30" rx="15" fill="rgba(94,234,212,0.12)" stroke="#5eead4" stroke-width="1"/>
  <circle cx="638" cy="55" r="4" fill="#5eead4"/>
  <text x="650" y="59" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5eead4">3 REPOS LIVE</text>
</svg>
